  <title id="title">SentinelAI planned MVP architecture</title>
  <desc id="desc">Linux, Nginx and application logs enter the Sentinel Agent, then backend ingestion and storage. Rules and Isolation Forest feed correlation and incidents, followed by timelines and evidence-grounded AI investigation. Backend and investigation stages are planned.</desc>
